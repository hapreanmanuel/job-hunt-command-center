# Tests never talk to the providers; these only need to be present.
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.github.client-id=test-client-id
spring.security.oauth2.client.registration.github.client-secret=test-client-secret

# One connection, so a request that needs a second one fails here rather than in production.
spring.datasource.hikari.maximum-pool-size=1

server.servlet.session.cookie.secure=false

# Fail in seconds rather than half a minute if a test runs out of connections.
spring.datasource.hikari.connection-timeout=3000

# Who the sign-in tests may let in.
app.access.invited-emails=invited@example.com
app.access.invited-github-users=invited-user

# Shown on the sign-in page.
app.site.access-request-url=https://example.com/request-access
app.site.owner=Test Owner
app.site.contact-email=contact@example.com
