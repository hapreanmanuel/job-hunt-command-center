# A local run: one fixed user, no sign-in. Activate with SPRING_PROFILES_ACTIVE=local.
# Values here are local placeholders, never real credentials.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/job_hunt}
spring.datasource.username=${DB_USERNAME:job_hunt}
spring.datasource.password=${DB_PASSWORD:local_dev_only}

# Not used locally, but Spring needs a client to exist.
spring.security.oauth2.client.registration.google.client-id=not-used-locally
spring.security.oauth2.client.registration.google.client-secret=not-used-locally
spring.security.oauth2.client.registration.github.client-id=not-used-locally
spring.security.oauth2.client.registration.github.client-secret=not-used-locally

server.servlet.session.cookie.secure=false
spring.thymeleaf.cache=false

app.local-user-id=00000000-0000-0000-0000-000000000001
app.sign-in-enabled=false

# The pages need a value; nobody else sees a local run.
app.site.owner=Local user
app.site.contact-email=local@example.com
