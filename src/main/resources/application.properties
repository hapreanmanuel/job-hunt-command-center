spring.application.name=job-hunt-command-center

# ---------------------------------------------------------------------
# Database. Flyway migrates at startup.
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

spring.flyway.schemas=app
spring.flyway.placeholder-replacement=false

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=app
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------
# Google sign-in (Google Cloud Console > APIs & Services > Credentials).
# Redirect URI registered with Google: <app URL>/login/oauth2/code/google
# Without these settings the app refuses to start, so a hosted copy can't be left open.
# ---------------------------------------------------------------------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email

# What the pages show. Access itself is decided in SecurityConfig.
app.sign-in-enabled=true

# Who runs the site, for the Privacy and Terms pages. A hosted copy needs both to start.
# An empty link stays hidden.
app.site.owner=${APP_SITE_OWNER}
app.site.contact-email=${APP_SITE_CONTACT_EMAIL}
app.site.coffee-url=
app.site.access-request-url=

# Who may sign in: comma-separated emails. Empty lets nobody in.
app.access.invited-emails=${APP_INVITED_EMAILS:}
# True lets any Google account use the app, each with their own private data.
app.access.open=${APP_OPEN:false}

# ---------------------------------------------------------------------
# Sessions (Spring Session JDBC): logins are stored in Postgres, so they survive
# restarts and a host that sleeps. Flyway creates the tables.
# ---------------------------------------------------------------------
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=app.spring_session
spring.session.timeout=14d

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Secure cookies are only sent over HTTPS. Keep true anywhere but a local run.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}

# Behind a host's proxy the app must know it's served over https, for Google's redirect URL.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
server.port=${PORT:8080}

spring.thymeleaf.cache=true
spring.jackson.default-property-inclusion=non_null

# Error responses never include stack traces or exception messages.
server.error.include-stacktrace=never
server.error.include-message=never

# ---------------------------------------------------------------------
# Health check: GET /actuator/health answers UP or DOWN, and nothing else is exposed.
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
