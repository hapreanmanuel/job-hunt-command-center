# Render reads this when you create the service as a Blueprint. Secrets are
# entered in the Render dashboard, never here.
services:
  - type: web
    name: job-hunt-center
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /actuator/health
    envVars:
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1
      - key: FORWARD_HEADERS_STRATEGY
        value: framework
      - key: APP_OPEN
        value: "false"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APP_INVITED_EMAILS
        sync: false
      - key: APP_SITE_OWNER
        sync: false
      - key: APP_SITE_CONTACT_EMAIL
        sync: false
