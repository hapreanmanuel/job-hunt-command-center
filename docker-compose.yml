# Local development only. Hosted deployments set their own credentials.
services:
  db:
    image: postgres:16-alpine
    container_name: job-hunt-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: job_hunt
      POSTGRES_USER: job_hunt
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - job-hunt-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_hunt -d job_hunt"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: job-hunt-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://db:5432/job_hunt
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  job-hunt-db-data:
